_format_version: "3.0"
_transform: true

services:
  - name: orders
    url: http://host.docker.internal:3333
    protocol: http
    port: 3333
    path: /
    routes:
      - name: api
        protocols:
          - http
          - https
        paths:
          - /orders
         

plugins: 
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
        - "PATCH"
        - "GET"
      headers:
        - "Accept"
        - "Content-Type"
        - "Authorization"